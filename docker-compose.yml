services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: thameslink-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - ./data/storage/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: thameslink-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/London
    volumes:
      - ./data/storage/n8n:/home/node/.n8n
    depends_on:
      - qdrant
